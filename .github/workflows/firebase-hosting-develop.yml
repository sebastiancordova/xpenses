name: Deploy develop to Firebase Hosting

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: firebase-hosting-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Hosting site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Require Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_XPENSES_93552 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s\n' 'Required repository secret FIREBASE_SERVICE_ACCOUNT_XPENSES_93552 is empty or unavailable.' >&2
            exit 1
          fi

      - name: Deploy Hosting site to live
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_XPENSES_93552 }}
          projectId: xpenses-93552
          target: xpenses
          channelId: live
          firebaseToolsVersion: 12.3.1
