<div class="expense-modal-header">
  <h5 class="expense-modal-header__title">Editar gasto</h5>
  <button type="button" class="expense-modal-header__close" (click)="activeModal.dismiss()" aria-label="Cerrar">
    <i class="fas fa-times"></i>
  </button>
</div>

<div class="expense-modal-body">
  <form [formGroup]="editExpenseForm" (ngSubmit)="submit()" novalidate>

    <div class="form-group">
      <label class="field-label" for="title">Título</label>
      <input autocomplete="off" type="text" class="form-control field-input" id="title" formControlName="title">
      <small class="field-error" *ngIf="title?.invalid && title?.touched && title?.hasError('required')">
        El título es obligatorio
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="amount">Monto</label>
      <div class="amount-input-wrapper">
        <span class="amount-prefix">$</span>
        <input autocomplete="off" type="text" pattern="-?[0-9]+" inputmode="decimal"
          class="form-control field-input field-input--amount" id="amount" formControlName="amount">
      </div>
      <small class="field-error" *ngIf="amount?.invalid && amount?.touched && amount?.hasError('required')">
        El monto es obligatorio
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="category">Categoría</label>
      <select id="category" class="form-control field-input" formControlName="category">
        <option value="">Seleccione una categoría</option>
        <option *ngFor="let enum of expenseCategory | keyvalue" [value]="enum.key">{{ enum.value }}</option>
      </select>
      <small class="field-error" *ngIf="category?.invalid && category?.touched && category?.hasError('required')">
        La categoría es obligatoria
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="comment">Comentario <span class="field-optional">(opcional)</span></label>
      <textarea id="comment" rows="2" class="form-control field-input" formControlName="comment"
        placeholder="Añade una nota..."></textarea>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-modal btn-modal--danger" (click)="delete()">
        <i class="fas fa-trash mr-1"></i>Eliminar
      </button>
      <button type="submit" class="btn-modal btn-modal--primary" [disabled]="editExpenseForm.invalid">
        <span *ngIf="!loading">Guardar</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin mr-1"></i>Guardando...</span>
      </button>
    </div>

  </form>
</div>
