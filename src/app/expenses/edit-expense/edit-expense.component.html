<div class="expense-modal-header">
  <h5 class="expense-modal-header__title">Editar gasto</h5>
  <button type="button" class="expense-modal-header__close" (click)="activeModal.dismiss()" aria-label="Cerrar">
    <i class="fas fa-times"></i>
  </button>
</div>

<div class="expense-modal-body">
  <form [formGroup]="editExpenseForm" (ngSubmit)="submit()" novalidate>

    <div class="form-group">
      <label class="field-label" for="title">Título</label>
      <input autocomplete="off" type="text" class="form-control field-input" id="title" formControlName="title"
        [class.field-input--valid]="title?.valid && title?.touched" ngbAutofocus>
      <small class="field-error" *ngIf="title?.invalid && title?.touched && title?.hasError('required')">
        El título es obligatorio
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="amount">Monto</label>
      <div class="amount-input-wrapper">
        <span class="amount-prefix">$</span>
        <input autocomplete="off" type="text" pattern="-?[0-9]+" inputmode="decimal"
          class="form-control field-input field-input--amount" id="amount" formControlName="amount"
          [class.field-input--valid]="amount?.valid && amount?.touched">
      </div>
      <small class="field-error" *ngIf="amount?.invalid && amount?.touched && amount?.hasError('required')">
        El monto es obligatorio
      </small>
    </div>

    <div class="form-group">
      <label class="field-label">Categoría</label>
      <div class="category-grid">
        <button type="button" class="category-pill"
                *ngFor="let cat of expenseCategory | keyvalue"
                [ngClass]="[getCategoryClass(cat.key), category?.value === cat.key ? 'category-pill--active' : '']"
                (click)="selectCategory(cat.key)">
          <i class="fas" [ngClass]="categoryIcons[cat.key] || 'fa-tag'"></i>
          <span>{{ cat.value }}</span>
        </button>
      </div>
      <small class="field-error" *ngIf="category?.invalid && category?.touched">
        La categoría es obligatoria
      </small>
    </div>

    <div class="form-group">
      <div class="field-label-row">
        <label class="field-label" for="comment">Comentario <span class="field-optional">(opcional)</span></label>
        <span class="field-char-count" [class.field-char-count--near]="(comment?.value?.length || 0) > 90">
          {{ comment?.value?.length || 0 }}/{{ maxCommentLength }}
        </span>
      </div>
      <textarea id="comment" rows="3" class="form-control field-input" formControlName="comment"
        placeholder="Añade una nota..." [maxlength]="maxCommentLength"></textarea>
    </div>

    <div class="modal-actions">
      <div class="delete-zone">
        <button type="button" class="btn-modal btn-modal--danger"
                [class.btn-modal--danger-confirm]="confirmingDelete"
                (click)="delete()">
          <i class="fas mr-1" [ngClass]="confirmingDelete ? 'fa-triangle-exclamation' : 'fa-trash'"></i>
          {{ confirmingDelete ? '¿Confirmar?' : 'Eliminar' }}
        </button>
        <button *ngIf="confirmingDelete" type="button" class="btn-modal btn-modal--ghost"
                (click)="confirmingDelete = false">
          No
        </button>
      </div>
      <button type="submit" class="btn-modal btn-modal--primary" [disabled]="editExpenseForm.invalid || loading">
        <span *ngIf="!loading">Guardar</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin mr-1"></i>Guardando...</span>
      </button>
    </div>

  </form>
</div>
