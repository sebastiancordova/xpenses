<div class="modal-header-bar">
  <h2 class="modal-header-bar__title">Nuevo ingreso</h2>
  <button type="button" class="modal-header-bar__close" (click)="activeModal.dismiss()" aria-label="Cerrar formulario de ingreso">
    <i class="fas fa-times" aria-hidden="true"></i>
  </button>
</div>

<div class="modal-body-content">
  <form [formGroup]="addIncomeForm" (ngSubmit)="submit()" novalidate [attr.aria-busy]="loading">

    <div class="form-row">
      <div class="form-group col-12 col-sm-6">
        <label class="field-label" for="period">Mes del ingreso</label>
        <input id="period" type="month" class="form-control field-input" formControlName="period">
      </div>

      <div class="form-group col-12 col-sm-6">
        <span class="field-label" id="income-type-label">Tipo de ingreso</span>
        <div class="income-type-toggle" role="group" aria-labelledby="income-type-label">
          <button type="button" class="income-type-toggle__option"
            [class.income-type-toggle__option--active]="addIncomeForm.get('type')?.value === 'fixed'"
            [attr.aria-pressed]="addIncomeForm.get('type')?.value === 'fixed'" (click)="selectType('fixed')">
            Sueldo fijo
          </button>
          <button type="button" class="income-type-toggle__option"
            [class.income-type-toggle__option--active]="addIncomeForm.get('type')?.value === 'variable'"
            [attr.aria-pressed]="addIncomeForm.get('type')?.value === 'variable'" (click)="selectType('variable')">
            Variable
          </button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="field-label" for="title">Título</label>
      <input autocomplete="off" type="text" class="form-control field-input" id="title" formControlName="title"
        placeholder="Ej: Sueldo base u horas extra" ngbAutofocus aria-describedby="income-title-error" [attr.aria-invalid]="title?.invalid && title?.touched">
      <small id="income-title-error" class="field-error" role="alert" *ngIf="title?.invalid && title?.touched && title?.hasError('required')">
        El título es obligatorio
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="amount">Monto del mes</label>
      <div class="amount-input-wrapper">
        <span class="amount-prefix">$</span>
        <input autocomplete="off" type="text" pattern="[0-9]*" inputmode="numeric"
          class="form-control field-input field-input--amount" id="amount" formControlName="amount" placeholder="0"
          aria-describedby="income-amount-error" [attr.aria-invalid]="amount?.invalid && amount?.touched">
      </div>
      <small id="income-amount-error" class="field-error" role="alert" *ngIf="amount?.invalid && amount?.touched && amount?.hasError('required')">
        El monto es obligatorio
      </small>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-modal btn-modal--secondary" (click)="activeModal.dismiss()">Cancelar</button>
      <button type="submit" class="btn-modal btn-modal--primary" [disabled]="addIncomeForm.invalid || loading">
        <span *ngIf="!loading">Guardar</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin mr-1"></i>Guardando...</span>
      </button>
    </div>

  </form>
</div>
