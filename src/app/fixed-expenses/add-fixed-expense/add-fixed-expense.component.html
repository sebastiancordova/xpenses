<div class="modal-header-bar">
  <h5 class="modal-header-bar__title">Nuevo gasto fijo</h5>
  <button type="button" class="modal-header-bar__close" (click)="activeModal.dismiss()" aria-label="Cerrar">
    <i class="fas fa-times"></i>
  </button>
</div>

<div class="modal-body-content">
  <form [formGroup]="addFixedExpenseForm" (ngSubmit)="submit()" novalidate>

    <div class="form-group">
      <label class="field-label" for="title">Título</label>
      <input autocomplete="off" type="text" class="form-control field-input" id="title"
        formControlName="title" placeholder="Ej: Arriendo">
      <small class="field-error" *ngIf="title?.invalid && title?.touched && title?.hasError('required')">
        El título es obligatorio
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="amount">Monto</label>
      <div class="amount-input-wrapper">
        <span class="amount-prefix">$</span>
        <input autocomplete="off" type="text" pattern="[0-9]*" inputmode="numeric"
          class="form-control field-input field-input--amount" id="amount" formControlName="amount" placeholder="0">
      </div>
      <small class="field-error" *ngIf="amount?.invalid && amount?.touched && amount?.hasError('required')">
        El monto es obligatorio
      </small>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-modal btn-modal--secondary" (click)="activeModal.dismiss()">Cancelar</button>
      <button type="submit" class="btn-modal btn-modal--primary" [disabled]="addFixedExpenseForm.invalid">
        <span *ngIf="!loading">Guardar</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin mr-1"></i>Guardando...</span>
      </button>
    </div>

  </form>
</div>
