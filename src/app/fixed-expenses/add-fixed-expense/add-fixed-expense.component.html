<div class="modal-header-bar">
  <h2 class="modal-header-bar__title">Nuevo gasto fijo</h2>
  <button type="button" class="modal-header-bar__close" (click)="activeModal.dismiss()" aria-label="Cerrar formulario de gasto fijo">
    <i class="fas fa-times" aria-hidden="true"></i>
  </button>
</div>

<div class="modal-body-content">
  <form [formGroup]="addFixedExpenseForm" (ngSubmit)="submit()" novalidate [attr.aria-busy]="loading">

    <div class="form-group">
      <label class="field-label" for="title">Título</label>
      <input autocomplete="off" type="text" class="form-control field-input" id="title" formControlName="title"
        placeholder="Ej: Arriendo" ngbAutofocus aria-describedby="fixed-expense-title-error" [attr.aria-invalid]="title?.invalid && title?.touched">
      <small id="fixed-expense-title-error" class="field-error" role="alert" *ngIf="title?.invalid && title?.touched && title?.hasError('required')">
        El título es obligatorio
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="amount">Monto mensual estimado</label>
      <div class="amount-input-wrapper">
        <span class="amount-prefix">$</span>
        <input autocomplete="off" type="text" pattern="[0-9]*" inputmode="numeric"
          class="form-control field-input field-input--amount" id="amount" formControlName="amount" placeholder="0"
          aria-describedby="fixed-expense-amount-error" [attr.aria-invalid]="amount?.invalid && amount?.touched">
      </div>
      <small id="fixed-expense-amount-error" class="field-error" role="alert" *ngIf="amount?.invalid && amount?.touched">
        Ingresa un monto entero mayor que cero, sin puntos.
      </small>
    </div>

    <div class="form-group">
      <label class="field-label" for="fixed-payment-method">Método de pago</label>
      <select id="fixed-payment-method" class="form-control field-input" formControlName="paymentMethodId">
        <option value="" disabled>Selecciona un método</option>
        <option *ngFor="let method of paymentMethods" [value]="method.uid">{{ method.name }}</option>
      </select>
      <small class="field-error" *ngIf="paymentMethodId?.invalid && paymentMethodId?.touched">Selecciona el método que cobra este gasto.</small>
    </div>

    <p class="text-muted">Este monto sirve para estimar los próximos meses. Luego podrás registrar el cargo real de cada mes.</p>
    <div class="modal-actions">
      <button type="button" class="btn-modal btn-modal--secondary" (click)="activeModal.dismiss()">Cancelar</button>
      <button type="submit" class="btn-modal btn-modal--primary" [disabled]="addFixedExpenseForm.invalid || loading">
        <span *ngIf="!loading">Guardar</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin mr-1"></i>Guardando...</span>
      </button>
    </div>

  </form>
</div>
