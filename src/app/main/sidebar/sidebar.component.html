<button
  *ngIf="isActive"
  class="sidebar-backdrop d-md-none"
  type="button"
  aria-label="Cerrar menú de navegación"
  (click)="closeSidebar()"></button>

<nav id="primary-navigation" class="col-md-3 col-lg-2 d-md-block sidebar" [ngClass]="{ active: isActive }" aria-label="Navegación principal">
  <div class="sidebar-inner d-flex flex-column justify-content-between h-100">
    <button type="button" class="sidebar-mobile-close d-md-none" (click)="closeSidebar()" aria-label="Cerrar menú de navegación">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>

    <!-- Logo -->
    <div class="area-logo">
      <a class="xp-title" routerLink="/dashboard" (click)="onNavigate()" aria-label="Ir al dashboard">
        <img src="/assets/brand/xpenses-mark-white.svg" class="sidebar-logo-img" alt="Xpenses">
        <span class="sidebar-logo-text">Xpenses</span>
      </a>
    </div>

    <!-- Nav links -->
    <div class="section-links">
      <p class="nav-section-label">Menú</p>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" (click)="onNavigate()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-chart-pie nav-icon"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/ingresos" (click)="onNavigate()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-coins nav-icon"></i>
            <span>Ingresos</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/gastos" (click)="onNavigate()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-receipt nav-icon"></i>
            <span>Gastos</span>
          </a>
        </li>
        <li class="nav-section-label nav-section-label--nested" aria-hidden="true">Compromisos</li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/gastos-fijos" (click)="onNavigate()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-thumbtack nav-icon"></i>
            <span>Gastos Fijos</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/subscripciones" (click)="onNavigate()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-repeat nav-icon"></i>
            <span>Subscripciones</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/cuotas" (click)="onNavigate()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-credit-card nav-icon"></i>
            <span>Compras en cuotas</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- User card -->
    <div class="area-current-user mx-3 mb-2" *ngIf="currentUser">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-info">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-label">Mi cuenta</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="area-actions">
      <a class="nav-link" routerLink="/configuracion" (click)="onNavigate()"
        [routerLinkActive]="'active-link'">
        <i class="fa-solid fa-gear nav-icon"></i>
        <span>Configuración</span>
      </a>
      <button type="button" class="logout-link" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket nav-icon"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>

  </div>
</nav>
