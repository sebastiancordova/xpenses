<nav class="col-md-3 col-lg-2 d-md-block sidebar" [ngClass]="{ active: isActive }">
  <div class="sidebar-inner d-flex flex-column justify-content-between h-100">

    <!-- Mobile toggle -->
    <a href="" class="d-block d-md-none" id="btn-sidebar"
      (click)="toggleActive();$event.preventDefault();$event.stopPropagation()">
      <div class="circle">
        <i class="icon icon-active-false fas fa-bars"></i>
        <i class="icon icon-active-true fas fa-times"></i>
      </div>
    </a>

    <!-- Logo -->
    <div class="area-logo">
      <div class="xp-title" (click)="toggleActive(); goToRoute('/dashboard')">
        <img src="/assets/img/iso-white.png" class="sidebar-logo-img" alt="Xpenses">
        <span class="sidebar-logo-text">Xpenses</span>
      </div>
    </div>

    <!-- Nav links -->
    <div class="section-links">
      <p class="nav-section-label">Menú</p>
      <ul class="nav flex-column">
        <li class="nav-item">
          <div class="nav-link" [routerLink]="'/dashboard'" (click)="toggleActive()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-chart-pie nav-icon"></i>
            <span>Dashboard</span>
          </div>
        </li>
        <li class="nav-item">
          <div class="nav-link" [routerLink]="'/ingresos'" (click)="toggleActive()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-coins nav-icon"></i>
            <span>Ingresos</span>
          </div>
        </li>
        <li class="nav-item">
          <div class="nav-link" [routerLink]="'/gastos'" (click)="toggleActive()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-receipt nav-icon"></i>
            <span>Gastos</span>
          </div>
        </li>
        <li class="nav-item">
          <div class="nav-link" [routerLink]="'/gastos-fijos'" (click)="toggleActive()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-thumbtack nav-icon"></i>
            <span>Gastos Fijos</span>
          </div>
        </li>
        <li class="nav-item">
          <div class="nav-link" [routerLink]="'/subscripciones'" (click)="toggleActive()"
            [routerLinkActive]="'active-link'">
            <i class="fa-solid fa-repeat nav-icon"></i>
            <span>Subscripciones</span>
          </div>
        </li>
      </ul>
    </div>

    <!-- User card -->
    <div class="area-current-user mx-3 mb-2" *ngIf="currentUser">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-info">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-label">Mi cuenta</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="area-actions">
      <div class="nav-link" [routerLink]="'/configuracion'" (click)="toggleActive()"
        [routerLinkActive]="'active-link'">
        <i class="fa-solid fa-gear nav-icon"></i>
        <span>Configuración</span>
      </div>
      <a href="" class="logout-link" (click)="logout();$event.preventDefault()">
        <i class="fa-solid fa-right-from-bracket nav-icon"></i>
        <span>Cerrar sesión</span>
      </a>
    </div>

  </div>
</nav>
