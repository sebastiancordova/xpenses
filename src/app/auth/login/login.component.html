<div class="auth-wrapper">

  <!-- Left: brand panel (desktop only) -->
  <div class="brand-panel">
    <img src="/assets/brand/xpenses-mark-white.svg" class="brand-panel__logo" alt="Xpenses">
    <h1 class="brand-panel__title">Xpenses</h1>
    <p class="brand-panel__tagline">Tus finanzas personales, claras y bajo control</p>
  </div>

  <!-- Right: form panel -->
  <div class="form-panel">
    <div class="form-card">

      <img src="/assets/brand/xpenses-mark-color.svg" class="form-card__mobile-logo" alt="Xpenses">
      <h2 class="form-card__title">Bienvenido</h2>
      <p class="form-card__subtitle">Inicia sesión en tu cuenta</p>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>

        <div class="form-group">
          <label class="field-label" for="email">Correo electrónico</label>
          <input type="email" autocomplete="email" id="email" formControlName="email"
            class="form-control field-input" placeholder="nombre@gmail.com">
          <small class="field-error" *ngIf="email?.invalid && email?.touched && email?.hasError('required')">El correo electrónico es obligatorio</small>
          <small class="field-error" *ngIf="email?.invalid && email?.touched && email?.hasError('email')">Ingresa un correo válido</small>
        </div>

        <div class="form-group mb-0">
          <label class="field-label" for="password">Contraseña</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
              class="form-control field-input field-input--pw" placeholder="••••••••">
            <button type="button" class="pw-toggle" (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <small class="field-error" *ngIf="password?.invalid && password?.touched && password?.hasError('required')">La contraseña es obligatoria</small>
          <a class="forgot-link" routerLink="/auth/reset">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-auth" [disabled]="loginForm.invalid || loading">
          <span *ngIf="!loading">Iniciar sesión</span>
          <span *ngIf="loading"><i class="fas fa-spinner fa-spin mr-1"></i>Ingresando...</span>
        </button>

      </form>

      <p class="auth-footer">
        ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate gratis</a>
      </p>

    </div>
  </div>

</div>
